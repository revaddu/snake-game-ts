<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f0f0f0;
      font-family: Arial, sans-serif;
    }
    canvas {
      border: 2px solid #333;
      background: #fff;
    }
    .container {
      text-align: center;
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
    }
    .instructions {
      margin-top: 20px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Snake Game</h1>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="instructions">
      <p>Use arrow keys to control the snake. Press R to restart after game over.</p>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
